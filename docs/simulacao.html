<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guia de Visualização</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&display=swap">
<style>
:root{--bg:#F5F3F8;--fg:#1B1426;--mut:#6A6277;--line:#DDD6E6;--panel:#FFFFFF;--acc:#7139B8;--tagbg:#EFE8F7}
:root[data-theme=dark]{--bg:#150F1E;--fg:#ECE7F3;--mut:#9C93AB;--line:#2E2640;--panel:#1D1629;--acc:#B66BEA;--tagbg:#2A2040}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#150F1E;--fg:#ECE7F3;--mut:#9C93AB;--line:#2E2640;--panel:#1D1629;--acc:#B66BEA;--tagbg:#2A2040}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bar{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar b{font:700 14px "Bricolage Grotesque","Segoe UI",sans-serif}
.bar .seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-left:auto}
.bar .seg button{border:0;background:none;color:var(--fg);padding:6px 14px;font:inherit;cursor:pointer}
.bar .seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.bar .th{border:1px solid var(--line);background:none;color:var(--fg);border-radius:4px;padding:6px 10px;cursor:pointer;font:inherit}
.stage{overflow-x:auto;padding:16px}
.wrap{margin:0 auto}
/* ---------- tela do relatório (fixa 1280x720, como o Power BI) ---------- */
.cv{--p:#7139B8;--pd:#1C0F33;--ink:#211A2B;--soft:#F4ECFC;--hair:#E3DAEE;--lime:#D7F34A;--coral:#FF665D;
 width:1280px;height:720px;transform-origin:0 0;background:#FBF9FD;color:var(--ink);position:relative;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;font-size:13px;border:1px solid var(--hair)}
.hd{position:absolute;left:0;top:0;width:1280px;height:56px;background:var(--pd);display:flex;align-items:center;padding:0 24px;gap:28px;color:#fff}
.hd .brand{font:700 17px "Bricolage Grotesque","Segoe UI",sans-serif;letter-spacing:-.01em;margin-right:auto}
.hd .brand small{display:block;font:600 9px "Segoe UI",sans-serif;letter-spacing:.14em;color:#B9A8D6;margin-top:1px}
.hd button.n{background:none;border:0;border-bottom:2px solid transparent;color:#CFC2E6;font:inherit;font-size:14px;padding:6px 0;cursor:pointer}
.hd button.n:hover{color:#fff}.hd button.n[aria-current=page]{color:#fff;border-bottom-color:var(--lime)}
.hd .lang{display:flex;gap:2px;font-size:12px}.hd .lang button{background:none;border:0;color:#CFC2E6;padding:4px 7px;cursor:pointer;font:inherit}
.hd .lang button[aria-pressed=true]{color:var(--pd);background:#fff;border-radius:2px;font-weight:700}
.hd img.me{width:38px;height:38px;border-radius:50%;object-fit:cover;display:block}
.tt{position:absolute;left:24px;top:62px;font:800 26px/1 "Bricolage Grotesque","Segoe UI",sans-serif;letter-spacing:-.02em}
.tt mark{background:linear-gradient(transparent 58%,var(--lime) 58% 92%,transparent 92%);color:inherit;padding:0 2px}
.st{display:none}
.ct{position:absolute;right:24px;top:62px;display:flex;align-items:center;gap:16px}
.ct .cnt{font-size:14px;color:#5F5670}.ct .cnt strong{font:800 26px "Bricolage Grotesque","Segoe UI",sans-serif;color:var(--p);margin-right:4px}
.ct button{border:1px solid var(--ink);background:none;color:var(--ink);font-size:14px;padding:7px 14px;border-radius:3px;font:inherit;cursor:pointer}
.ct button:hover{background:var(--ink);color:#fff}
.sl{position:absolute;left:24px;right:24px;top:100px;height:62px;display:grid;grid-template-columns:repeat(6,1fr);column-gap:16px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:6px 0}
.sl h2{margin:0 0 4px;font:700 11px "Segoe UI";letter-spacing:.12em;text-transform:uppercase;color:#6A6277}.sl h2 i{font-style:normal;color:var(--p);margin-right:6px}
.sl select{width:100%;height:36px;font-size:14px;border:1px solid #C9BDDA;background:#fff;border-radius:3px;padding:0 8px;font:inherit;color:var(--ink)}
.sl .o{display:flex;gap:4px}.sl .o button{flex:1;height:36px;border:1px solid #C9BDDA;background:#fff;color:var(--ink);border-radius:3px;font:inherit;font-size:14px;cursor:pointer;padding:0 4px;white-space:nowrap}
.sl .o button:hover{background:var(--soft)}.sl .o button[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
.gal{position:absolute;left:24px;right:24px;top:170px;bottom:44px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#C9BDDA transparent;padding-right:6px}
.g4,.g3,.g6,.g2{align-items:start}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cd{background:#fff;border:1px solid var(--hair);border-radius:3px;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;display:block;width:100%}
.cd:hover{border-color:var(--p)}
.cd img{display:block;width:100%;aspect-ratio:8/5;background:#fff;border-bottom:1px solid var(--hair)}
.cd .ti{background:var(--p);color:#fff;padding:6px 9px;font:600 13px "Segoe UI";min-height:30px;display:flex;align-items:center}
.cd.f{cursor:pointer}.cd .bk{padding:10px 12px;font-size:13px;line-height:1.4;min-height:184px;border-bottom:1px solid var(--hair)}
.cd .bk dt{font:700 11px "Segoe UI";letter-spacing:.1em;text-transform:uppercase;color:var(--p);margin-top:6px}.cd .bk dt:first-child{margin-top:0}.cd .bk dd{margin:1px 0 0}
.emp{padding:60px 0;text-align:center;color:#5F5670}.emp b{display:block;font:700 20px "Bricolage Grotesque","Segoe UI",sans-serif;color:var(--ink);margin-bottom:4px}
.pg{position:absolute;left:0;right:0;bottom:0;height:32px;background:#EEE8F5;border-top:1px solid var(--hair);display:flex;align-items:flex-end;padding-left:24px;gap:2px}
.pg button{border:0;background:none;padding:6px 16px;font:inherit;font-size:13px;color:#5F5670;cursor:pointer;border-top:2px solid transparent}
.pg button[aria-current=page]{background:#FBF9FD;color:var(--ink);font-weight:600;border-top-color:var(--p)}
.pg span{margin-left:auto;margin-right:24px;align-self:center;font-size:12px;color:#5F5670}
/* credito */
.cs{position:absolute;left:24px;top:76px;bottom:44px;width:290px;border-right:1px solid var(--hair);padding-right:16px;overflow-y:auto}
.cs h2{margin:0 0 8px;font:700 11px "Segoe UI";letter-spacing:.12em;text-transform:uppercase;color:#6A6277}
.cs button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;font:inherit;font-size:14px;color:var(--ink);border-left:3px solid transparent;cursor:pointer}
.cs button:hover{background:var(--soft)}.cs button[aria-pressed=true]{background:var(--soft);border-left-color:var(--p);font-weight:600}
.cm{position:absolute;left:340px;right:24px;top:76px;bottom:44px;overflow-y:auto}
.cm .q{font:800 28px/1.12 "Bricolage Grotesque","Segoe UI",sans-serif;letter-spacing:-.02em;margin:0 0 10px;max-width:760px}
.cm .tip{border-left:3px solid var(--lime);padding:2px 0 2px 12px;margin:0 0 18px;max-width:700px;color:#4A4158;font-size:14px}
.cm .kc{font:700 11px "Segoe UI";letter-spacing:.12em;text-transform:uppercase;color:#6A6277;margin-bottom:8px}
/* sobre */
.ab{position:absolute;left:24px;right:24px;top:80px;bottom:44px;display:grid;grid-template-columns:360px 1fr;gap:48px}
.ab .l img{width:200px;height:200px;object-fit:cover;display:block;border-radius:3px}
.ab .l h1{font:800 34px/1.05 "Bricolage Grotesque","Segoe UI",sans-serif;letter-spacing:-.02em;margin:18px 0 4px}.ab .l p{margin:0;color:#5F5670}
.ab a.in{display:inline-block;margin-top:16px;background:var(--p);color:#fff;padding:9px 16px;text-decoration:none;border-radius:3px;font-weight:600}
.ab .r h2{font:800 30px "Bricolage Grotesque","Segoe UI",sans-serif;letter-spacing:-.02em;margin:0 0 6px}.ab .r .sub{color:#5F5670;margin:0 0 18px}
.ab ul{list-style:none;padding:0;margin:0 0 18px;border-top:1px solid var(--hair)}.ab li{font-size:14px;padding:9px 0;border-bottom:1px solid var(--hair)}
.ab .cr{background:var(--soft);padding:12px 14px;border-radius:3px;max-width:560px}
/* bastidores */
.bs{max-width:1280px;margin:0 auto;padding:4px 0 40px}
.bs h2{font:800 22px "Bricolage Grotesque","Segoe UI";letter-spacing:-.01em;margin:32px 0 10px}
.bs p.l{color:var(--mut);margin:0 0 14px;max-width:70ch}
.bs table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
.bs th{font:700 11px "Segoe UI";letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.bs td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.bs tr:last-child td{border-bottom:0}
.tag{display:inline-block;font:600 11px "Segoe UI";padding:2px 8px;border-radius:3px;white-space:nowrap}
.t-ok{background:#DDF5C8;color:#2C5A0F}.t-nat{background:var(--tagbg);color:var(--acc)}.t-web{background:#FFE3B8;color:#7A4A00}.t-plan{background:transparent;border:1px solid var(--line);color:var(--mut)}
:root[data-theme=dark] .t-ok{background:#27401B;color:#BDEB9A}:root[data-theme=dark] .t-web{background:#4A3510;color:#FFD08A}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .t-ok{background:#27401B;color:#BDEB9A}:root:not([data-theme=light]) .t-web{background:#4A3510;color:#FFD08A}}
.er{background:var(--panel);border:1px solid var(--line);padding:12px;overflow-x:auto}
.er svg{display:block;min-width:900px;width:100%;height:auto}
.er text{fill:var(--fg);font:12px "Segoe UI",sans-serif}.er .h{font-weight:700}.er .m{fill:var(--mut);font-size:11px}
.er rect.b{fill:var(--panel);stroke:var(--fg)}.er rect.hh{fill:var(--acc)}.er .hl{fill:#fff;font-weight:700}.er line,.er path{stroke:var(--fg);fill:none}

.cv button:focus-visible,.cv select:focus-visible{outline:3px solid #7139B8;outline-offset:2px}
.hd button:focus-visible{outline-color:#D7F34A}
.qs{position:absolute;left:24px;right:24px;top:130px;height:32px;display:flex;align-items:center;gap:8px}
.qs b{font:700 11px "Segoe UI";letter-spacing:.12em;text-transform:uppercase;color:#6A6277;margin-right:6px;white-space:nowrap}
.qs button{height:32px;border:1px solid #C9BDDA;background:#fff;color:var(--ink);border-radius:16px 16px 16px 16px;padding:0 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.qs button:hover{background:var(--soft)}.qs button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--lime)}
.qs .sp{margin-left:auto;display:flex;align-items:center;gap:8px}.qs .tg{display:flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.qs .tg button{border:0;border-radius:0;height:30px;background:none}.qs .tg button[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}
.emp button{margin-top:12px;border:1px solid var(--ink);background:none;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;border-radius:3px}
.ab .rf{margin-top:20px;max-width:620px}.ab .rf h3{font:700 11px "Segoe UI";letter-spacing:.12em;text-transform:uppercase;color:#6A6277;margin:0 0 6px}
.ab .rf p{margin:0;padding:6px 0;border-bottom:1px solid var(--hair);font-size:13px;color:#4A4158}.ab .rf b{color:var(--ink)}
.ph{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.phone{width:260px;border:2px solid var(--fg);border-radius:18px;background:#FBF9FD;color:#211A2B;overflow:hidden;font-size:12px}
.phone .ph-h{background:#1C0F33;color:#fff;padding:8px 12px;font:700 13px "Bricolage Grotesque","Segoe UI"}
.phone .ph-f{margin:8px;border:1px solid #C9BDDA;padding:7px 10px;border-radius:3px;background:#fff}
.phone .ph-g{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 8px 8px}
.phone .ph-c{border:1px solid #E3DAEE;background:#fff}.phone .ph-c img{width:100%;display:block}.phone .ph-c div{background:#7139B8;color:#fff;padding:3px 5px;font-size:10.5px}
.pn{flex:1;min-width:260px;max-width:60ch;color:var(--mut)}

.mo{position:absolute;left:470px;top:62px;display:flex;align-items:center;gap:8px}.mo b{font:700 11px "Segoe UI";letter-spacing:.12em;text-transform:uppercase;color:#6A6277}
.mo .tg{display:flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden}.mo .tg button{border:0;height:32px;background:none;font:inherit;font-size:14px;padding:0 12px;cursor:pointer;color:var(--ink)}.mo .tg button[aria-pressed=true]{background:var(--ink);color:#fff}
.rd{position:absolute;left:24px;right:24px;top:170px;bottom:44px;background:#fff;border:1px solid var(--hair);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:56px 1fr;z-index:3}
.rd .rh{grid-column:1/3;background:var(--p);color:#fff;display:flex;align-items:center;padding:0 18px;font:700 20px "Bricolage Grotesque","Segoe UI",sans-serif}.rd .rh button{margin-left:auto;background:none;border:1px solid #fff;color:#fff;border-radius:3px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.rd img{width:100%;align-self:center;display:block}.rd dl{margin:0;padding:18px 24px;overflow:auto}.rd dt{font:700 11px "Segoe UI";letter-spacing:.12em;text-transform:uppercase;color:#5F5670;margin-top:12px}.rd dt:first-child{margin-top:0}.rd dd{margin:2px 0 0;font-size:14px;color:var(--ink)}
.stp .cs{width:290px}.stp .cm{left:340px}.stp .nt{position:absolute;left:24px;bottom:50px;width:280px;font-size:12px;line-height:1.5;color:#5F5670}
.stp ol{list-style:none;padding:0;margin:0 0 16px;max-width:820px}.stp li{padding:7px 0;border-bottom:1px solid var(--hair);font-size:14px}
.stp .ex figure{margin:0;background:#fff;border:1px solid var(--hair)}.stp .ex{grid-template-columns:repeat(2,minmax(0,1fr))}.stp .ex img{display:block;width:100%;height:auto}.stp{display:contents}.stp .ex figcaption{background:var(--p);color:#fff;padding:7px 10px;font:600 13px "Segoe UI"}
</style></head><body>
<div class="bar"><b>Guia de Visualização</b><span style="color:var(--mut)" id="sub"></span>
 <div class="seg" role="group"><button id="vRep" aria-pressed="true">Relatório</button><button id="vBs" aria-pressed="false">Bastidores</button></div>
 <button class="th" id="th" aria-label="Tema">◐</button></div>
<div class="stage" id="stage"><div class="wrap" id="wrap"><div class="cv" id="cv"></div></div></div>
<div class="stage" id="bsw" hidden></div>
<script>
const D={"charts": [{"id": 1, "slug": "barra_divergente", "pt": "Barras divergentes", "en": "Diverging bars", "uso_pt": "Compara valores acima e abaixo de uma referência.", "uso_en": "Compares values above and below a reference.", "cuidado_pt": "Defina a referência (zero ou meta) e mantenha uma só escala.", "cuidado_en": "Fix the reference (zero or target) and keep one scale.", "pbi_pt": "Nativo, com ajuste · Barras agrupadas com valores negativos", "pbi_en": "Native, adapted · Clustered bar with negative values", "usado_pt": "Financeira", "usado_en": "Financial", "perfil": "especialista", "ess": false}, {"id": 2, "slug": "espinha", "pt": "Gráfico de espinha", "en": "Spine chart", "uso_pt": "Espelha duas partes de um total ao redor de um eixo central.", "uso_en": "Mirrors two parts of a whole around a central axis.", "cuidado_pt": "Funciona com no máximo 2 categorias.", "cuidado_en": "Works with 2 categories at most.", "pbi_pt": "Deneb (Vega-Lite) · Deneb", "pbi_en": "Deneb (Vega-Lite) · Deneb", "usado_pt": "Financeira", "usado_en": "Financial", "perfil": "especialista", "ess": false}, {"id": 3, "slug": "area_divergente", "pt": "Área divergente", "en": "Diverging area", "uso_pt": "Mostra no tempo quando o valor passa de positivo a negativo.", "uso_en": "Shows over time when a value flips from positive to negative.", "cuidado_pt": "Use cores distintas e rotule o ponto de virada.", "cuidado_en": "Use distinct colors and label the turning point.", "pbi_pt": "Deneb (Vega-Lite) · Área com valores negativos, ou Deneb", "pbi_en": "Deneb (Vega-Lite) · Area with negative values, or Deneb", "usado_pt": "Financeira", "usado_en": "Financial", "perfil": "especialista", "ess": false}, {"id": 4, "slug": "dispersao", "pt": "Gráfico de dispersão", "en": "Scatter plot", "uso_pt": "Mostra se duas variáveis contínuas andam juntas.", "uso_en": "Shows whether two continuous variables move together.", "cuidado_pt": "Correlação não prova causa.", "cuidado_en": "Correlation does not prove c en": "Rates on a choropleth; totals as bubbles."}, {"t_pt": "Meta de recuperação", "t_en": "Recovery target", "q_pt": "Estamos acima ou abaixo da meta de recuperação?", "q_en": "Are we above or below the recovery target?", "charts": ["bullet", "linha_coluna", "cartao"], "n_pt": "Mostre sempre a meta junto do realizado.", "n_en": "Always show the target next to the actual."}, {"t_pt": "Movimento do saldo", "t_en": "Balance movement", "q_pt": "O que explica a variação do saldo da carteira?", "q_en": "What explains the change in the portfolio balance?", "charts": ["cascata"], "n_pt": "Saldo inicial, concessões, recebimentos, baixas e saldo final.", "n_en": "Opening balance, originations, collections, write-offs and closing balance."}, {"t_pt": "Distribuição de atraso ou score", "t_en": "Delinquency or score distribution", "q_pt": "Como os clientes se distribuem por dias de atraso ou score?", "q_en": "How are customers distributed by days past due or score?", "charts": ["histograma", "boxplot", "violino"], "n_pt": "Teste mais de uma largura de faixa.", "n_en": "Try more than one bin width."}, {"t_pt": "Canais de cobrança", "t_en": "Collection channels", "q_pt": "Qual canal traz melhor resultado ao longo do tempo?", "q_en": "Which channel performs best over time?", "charts": ["multilinhas", "colunas", "faixas"], "n_pt": "Compare poucos canais por vez.", "n_en": "Compare few channels at a time."}, {"t_pt": "Mix da carteira", "t_en": "Portfolio mix", "q_pt": "Como a carteira se divide por produto ou segmento?", "q_en": "How is the portfolio split by product or segment?", "charts": ["treemap", "barras"], "n_pt": "Prefira barras quando os valores forem próximos.", "n_en": "Prefer bars when values are close."}, {"t_pt": "Indicador-chave do dia", "t_en": "Key indicator of the day", "q_pt": "Qual número precisa aparecer primeiro?", "q_en": "Which number must show up first?", "charts": ["cartao", "bullet"], "n_pt": "Acompanhe de uma referência: meta ou período anterior.", "n_en": "Pair it with a reference: target or prior period."}, {"t_pt": "Ranking de carteiras e equipes", "t_en": "Portfolio and team ranking", "q_pt": "Quais carteiras ou equipes lideram?", "q_en": "Which portfolios or teams lead?", "charts": ["barras", "pirulito"], "n_pt": "Ordene pelo valor.", "n_en": "Sort by value."}], "topics": [{"slug": "contexto", "t_pt": "Entenda o contexto", "t_en": "Understand the context", "i_pt": "Antes de abrir o Power BI, defina quem vai ver, o que precisa decidir e como vai receber o dado.", "i_en": "Before opening Power BI, define who will see it, what they must decide and how they will receive the data.", "s_pt": ["1. Escreva em uma frase quem é o público e que decisão ele toma.", "2. Defina a ideia principal: o que a pessoa deve lembrar se esquecer o resto?", "3. Escolha o formato: relatório para explorar ou apresentação para explicar."], "s_en": ["1. Write in one sentence who the audience is and what decision they make.", "2. Define the big idea: what should they remember if they forget everything else?", "3. Pick the format: a report to explore or a presentation to explain."], "c0_pt": "Antes: Só o gráfico, sem dizer para quem nem para quê.", "c0_en": "Before: Just the chart, without saying for whom or why.", "c1_pt": "Depois: Quem, decisão e ideia principal antes do gráfico.", "c1_en": "After: Who, decision and big idea before the chart."}, {"slug": "escolher", "t_pt": "Escolha o gráfico certo", "t_en": "Pick the right chart", "i_pt": "O gráfico é a resposta a uma pergunta, não um enfeite.", "i_en": "A chart is the answer to a question, not decoration.", "s_pt": ["1. Comece pela pergunta: comparar, acompanhar no tempo, mostrar partes ou relacionar?", "2. Prefira barras e linhas: o olho mede comprimento e posição melhor que ângulo.", "3. Use a aba Guia deste projeto para filtrar as opções."], "s_en": ["1. Start with the question: compare, track over time, show parts or relate?", "2. Prefer bars and lines: the eye reads length and position better than angle.", "3. Use this project's Guide tab to filter the options."], "c0_pt": "Antes: Pizza com sete fatias: difícil comparar.", "c0_en": "Before: Pie with seven slices: hard to compare.", "c1_pt": "Depois: Barras ordenadas: a comparação é imediata.", "c1_en": "After: Sorted bars: the comparison is immediate."}, {"slug": "ruido", "t_pt": "Elimine o ruído", "t_en": "Remove the clutter", "i_pt": "Tudo o que não ajuda a entender atrapalha.", "i_en": "Whatever does not help understanding gets in the way.", "s_pt": ["1. Remova bordas, grades pesadas e legendas repetidas.", "2. Mostre só os rótulos que importam.", "3. Teste: tire o elemento. Se ninguém sentir falta, ele sai."], "s_en": ["1. Remove borders, heavy gridlines and repeated legends.", "2. Show only the labels that matter.", "3. Test it: remove the element. If nobody misses it, it stays out."], "c0_pt": "Antes: Grade, borda, legenda e rótulo em todas as colunas.", "c0_en": "Before: Grid, border, legend and a label on every column.", "c1_pt": "Depois: Só o necessário: colunas leves e um rótulo.", "c1_en": "After: Only what is needed: light columns and one label."}, {"slug": "olhar", "t_pt": "Direcione o olhar", "t_en": "Direct the eye", "i_pt": "Cor, tamanho e posição dizem onde olhar primeiro.", "i_en": "Color, size and position say where to look first.", "s_pt": ["1. Deixe tudo em lavanda ou cinza claro e destaque um elemento com a cor de ação.", "2. Use no máximo uma cor de destaque por gráfico.", "3. Ponha o mais importante no alto, à esquerda."], "s_en": ["1. Keep everything light lavender or gray and highlight one element with the action color.", "2. Use at most one highlight color per chart.", "3. Put the most important thing at the top left."], "c0_pt": "Antes: Tudo com o mesmo peso: o olho não sabe onde parar.", "c0_en": "Before: Everything has the same weight: the eye does not know where to stop.", "c1_pt": "Depois: Um destaque só e uma frase curta.", "c1_en": "After: One highlight and one short phrase."}, {"slug": "designer", "t_pt": "Pense como designer", "t_en": "Think like a designer", "i_pt": "Alinhamento, espaço em branco e hierarquia fazem o relatório parecer profissional.", "i_en": "Alignment, white space and hierarchy make a report look professional.", "s_pt": ["1. Alinhe tudo a uma grade e mantenha margens iguais.", "2. Use dois ou três tamanhos de texto, não dez.", "3. Deixe espaço em branco: ele separa e descansa."], "s_en": ["1. Align everything to a grid and keep margins equal.", "2. Use two or three text sizes, not ten.", "3. Leave white space: it separates and rests the eye."], "c0_pt": "Antes: Textos soltos, tamanhos aleatórios, nada alinhado.", "c0_en": "Before: Loose text, random sizes, nothing aligned.", "c1_pt": "Depois: Mesma informação, com grade e hierarquia.", "c1_en": "After: Same information, with a grid and hierarchy."}, {"slug": "historia", "t_pt": "Conte uma história", "t_en": "Tell a story", "i_pt": "Uma boa história tem começo, virada e ação.", "i_en": "A good story has a beginning, a turn and an action.", "s_pt": ["1. Contexto: onde estamos?", "2. Virada: o que mudou ou o que descobrimos?", "3. Ação: o que queremos que seja feito?"], "s_en": ["1. Context: where are we?", "2. Turn: what changed or what did we find?", "3. Action: what do we want done?"], "c0_pt": "Antes: Quatro gráficos soltos: cada pessoa conta uma história.", "c0_en": "Before: Four loose charts: everyone tells their own story.", "c1_pt": "Depois: Três passos, um gráfico por passo.", "c1_en": "After: Three steps, one chart per step."}, {"slug": "titulo", "t_pt": "Escreva títulos que concluem", "t_en": "Write titles that conclude", "i_pt": "O título deve dizer o que o dado mostra.", "i_en": "The title should say what the data shows.", "s_pt": ["1. Troque \"Vendas por mês\" por uma frase com o resultado e o número.", "2. Coloque o título à esquerda, no alto.", "3. Use o subtítulo para período e unidade."], "s_en": ["1. Swap \"Sales by month\" for a sentence with the result and the number.", "2. Place the title at the top left.", "3. Use the subtitle for period and unit."], "c0_pt": "Antes: Título que só descreve o eixo.", "c0_en": "Before: A title that only describes the axis.", "c1_pt": "Depois: Título com a conclusão e o trecho destacado.", "c1_en": "After: A title with the conclusion and the highlighted stretch."}, {"slug": "rotulos", "t_pt": "Rotule direto no gráfico", "t_en": "Label directly on the chart", "i_pt": "Quanto menos o olho viaja, mais rápido a mensagem chega.", "i_en": "The less the eye travels, the faster the message arrives.", "s_pt": ["1. Escreva o nome da série no fim da linha.", "2. Tire a legenda quando houver até cinco séries.", "3. Mantenha a mesma cor entre rótulo e série."], "s_en": ["1. Write the series name at the end of the line.", "2. Drop the legend when there are up to five series.", "3. Keep the same color for label and series."], "c0_pt": "Antes: Legenda embaixo: o olho vai e volta.", "c0_en": "Before: Legend at the bottom: the eye goes back and forth.", "c1_pt": "Depois: Nome no fim de cada linha.", "c1_en": "After: Name at the end of each line."}], "stimg": {"historia_antes_en": "data:image/webp;base64,UklGRrITAABXRUJQVlA4IKYTAAAQpwCdASogA/QBPmEwl0gkIyIhIlNYaIAMCWdu/DJZyAxP+Trcvkf6hya/U2pzeoedcz/877sPmP/oP+J7EP0p7A36m+dp6sPML/NP8R+zHvW/8P1mf6b1AP9J/pPSq9lT0Iv259Ob9yPhm/uP/X/b32u+v16X/p3/ke13/M9Dl6mk93FfTP915k/7rwX+NuoF6t/0++B6j/m/QC9m/nnn7+teY32K/z3uAd9d4JnnvsAfzv/C/7v+2/kr8mf/h5qvqj2C/1760YX8UqBsO01S6qfFCzYdpql1U+KFmw7TUu75FnsmULVA1yNUvRObd+hi7qDoULNh2mqXVT4oWbDtNUuqnxQs1aLp11NDCJ+cpbnQ3rd473tm51Y+qwfNrRubtiGU1U+KFmw7TVLqp8ULNh2mqXVKJW5Kw/rc8K/FQNh2mqXVT4oWbDtNUuqnxQs2HaapdVPihZsO01S6qfFCzYdpql1U+KFmw7TVLqp8ULNh2mqXVT4oWbDtNUuqnxQs2HaapdVPihZsO01SYn5YWIL7mqnxQs2HaapdVPihZsO01S6qfEzEJ5lI2/sbCfJVPhKjumKctDOaqfFCzYdpql1U+KFmw7TVLqphCy4wsnoXnaXmsxvVwF3Pdj1yBlNVPihZsO01S6qfFCzYdjEHkVWOQzYO1E1prT4oWbDtNUuqnxQs2HaapdVPiZ1crVWvXHljooCmJv7TVLqp8ULNh2mqXVLFTv//lJnvTSnhbExQNZUFk55MtFHLpP const G=Object.fromEntries(D.charts.map(c=>[c.id,c])),BY=Object.fromEntries(D.charts.map(c=>[c.slug,c]));

function reset(){S.rd=0;S.ess=true;S.obj='';K.forEach(k=>S[k].clear());S.flip.clear()}
function go(p){const nl=isEn(p)?'en':isPt(p)?'pt':S.lang;if(nl!==S.lang)reset();S.lang=nl;S.page=p;render()}
function vis(){const m=new Set();for(const r of D.rows){if(S.ess&&!G[r.g].ess)continue;if(S.obj&&String(r.o)!==S.obj)continue;let ok=true;for(const k of K)if(S[k].size&&!S[k].has(r[k])){ok=false;break}if(ok)m.add(r.g)}return [...m].sort((a,b)=>a-b)}
function card(g,L,t){const c=G[g],f=S.flip.has(g);
 if(!f)return `<button class="cd" data-g="${g}" aria-expanded="false" aria-label="${esc(c[L])}. ${esc(c['uso_'+L])}"><img src="${img(c.slug)}" alt=""><div class="ti">${esc(c[L])}</div></button>`;

function header(L,t){const p=S.page,cur=p==='sobre'?3:p.startsWith('cr')?2:p.startsWith('st')?1:0;const tgt=[L,'st_'+L,'cr_'+L,'sobre'];
 return `<div class="hd"><div class="brand">Lucas Delfino<small>DATA & BI ANALYST</small></div>`+t.nav.map((n,i)=>`<button class="n" data-go="${tgt[i]}" ${i===cur?'aria-current="page"':''}>${n}</button>`).join('')+`<button class="n" data-url="${PORT}">${t.port}</button><button class="n" data-url="${LI}">LinkedIn ↗</button><div class="lang"><button data-setlang="pt" aria-pressed="${L==='pt'}">PT</button><button data-setlang="en" aria-pressed="${L==='en'}">EN</button></div><img class="me" src="${AVATAR}" alt="Lucas Delfino"></div>`}
function tabs(t){const i=PAGES.indexOf(S.page);return `<div class="pg">`+t.tabs.map((n,j)=>`<button data-go="${PAGES[j]}" ${j===i?'aria-current="page"':''}>${n}</button>`).join('')+`<span>${t.note}</span></div>`}
function reader(L,t){const c=G[S.rd];return `<div class="rd" role="dialog" aria-label="${esc(c[L])}"><div class="rh">${esc(c[L])}<button data-close="1">${t.close}</button></div><div><img src="${img(c.slug)}" alt=""></div><dl><dt>${t.lab[0]}</dt><dd>${esc(c['uso_'+L])}</dd><dt>${t.lab[1]}</dt><dd>${esc(c['cuidado_'+L])}</dd><dt>${t.lab[2]}</dt><dd>${esc(c['pbi_'+L])}</dd><dt>${t.lab[3]}</dt><dd>${esc(c['usado_'+L])}</dd></dl></div>`}
function pageGuide(L,t){const ids=vis();
 const opt=k=>`<select data-sel="${k}" aria-label="${t.steps[K.indexOf(k)+1]}"><option value="">${t.allv}</option>`+Object.entries(D.labels[k]).map(([o,l])=>`<option value="${o}"${S[k].has(+o)?' selected':''}>${esc(l[L])}</option>`).join('')+`</select>`;
 const sel=`<select id="obj" aria-label="${t.steps[0]}"><option value="">${t.all}</option>${D.objs.map(o=>`<option value="${o.id}"${S.obj==o.id?' selected':''}>${esc(o[L])}</option>`).join('')}</select>`;
 const body=[sel,...K.map(opt)].map((b,i)=>`<div><h2><i>0${i+1}</i>${t.steps[i]}</h2>${b}</div>`).join('');
 const mo=`<div class="mo"><b>${t.showL}</b><div class="tg"><button data-ess="1" aria-pressed="${S.ess}">${t.ess[0]}</button><button data-ess="0" aria-pressed="${!S.ess}">${t.ess[1]}</button></div></div>`;
 return `<div class="tt">${t.title}</div>${mo}<div class="ct"><span class="cnt">${t.of(ids.length,D.charts.length)}</span><button data-clear="1">${t.clear}</button></div><div class="sl">${body}</div><div class="gal">${ids.length?`<div class="g6">${ids.map(g=>card(g,L,t)).join('')}</div>`:`<div class="emp"><b>${t.emptyT}</b>${t.emptyD}${S.ess?`<br><button data-ess="0">${t.showAll}</button>`:''}</div>`}</div>${S.rd?reader(L,t):''}`}
function pageStory(L,t){const tp=D.topics[S.tp];
 return `<div class="stp"><div class="cs"><h2>${t.stT}</h2>`+D.topics.map((x,i)=>`<button data-tp="${i}" aria-pressed="${i===S.tp}">${esc(x['t_'+L])}</button>`).join('')+`</div><div class="nt">${t.stNote}</div><div class="cm"><h1 class="q">${esc(tp['t_'+L])}</h1><p class="tip">${esc(tp['i_'+L])}</p><div class="kc">${t.stSteps}</div><ol>${tp['s_'+L].map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="kc">${t.stEx}</div><div class="g2 ex">${['antes','depois'].map((k,j)=>`<figure><img src="${D.stimg[tp.slug+'_'+k+'_'+L]}" alt="${esc(tp['c'+j+'_'+L])}"><figcaption>${esc(tp['c'+j+'_'+L])}</figcaption></figure>`).join('')}</div></div></div>`}
function pageCases(L,t){const c=D.cases[S.cs];
 return `<div class="cs"><h2>${t.cases}</h2>`+D.cases.map((x,i)=>`<button data-cs="${i}" aria-pressed="${i===S.cs}">${esc(x['t_'+L])}</button>`).join('')+`</div><div class="cm"><h1 class="q">${esc(c['q_'+L])}</h1><p class="tip"><b>${t.tipL}:</b> ${esc(c['n_'+L])}</p><div class="kc">${t.cardsL}</div><div class="g3">${c.charts.map(s=>card(BY[s].id,L,t)).join('')}</div></div>${S.rd?reader(L,t):''}`}
function pageAbout(L,t){return `<div class="ab"><div class="l"><img src="${AVATAR}" alt="Lucas Delfino"><h1>Lucas Delfino</h1><p>${t.role}</p><a class="in" href="${LI}" target="_blank" rel="noopener">${t.connect}</a><br><a class="in" style="background:none;color:var(--ink);border:1px solid var(--ink);margin-top:10px" href="${PORT}" target="_blank" rel="noopener">${t.port}</a></div><div class="r"><h2>${t.aboutT}</h2><p class="sub">${t.aboutSub}</p><ul>${t.facts.map(f=>`<li>${f}</li>`).join('')}</ul><div class="cr">${t.credit}</div><div class="rf"><h3>${t.refT}</h3>${t.refs.map(r=>`<p><b>${r[0]}</b> — ${r[1]}</p>`).join('')}<p>${t.orig}</p></div></div></div>`}
function bastidores(){
 const rows=[['Descobrir','PT','Título, Essenciais/Demais, 6 listas suspensas, contador, Limpar filtros, galeria Card Browser','Detalhes abrem no leitor do visual'],['Discover','EN','Mesmos visuais, campos em inglês','Estado dos filtros reinicia ao trocar de idioma'],['Storytelling','PT','Lista de 8 tópicos, ideia, passos em tabela, exemplos antes e depois','Medidas SELECTEDVALUE e Card Browser'],['Storytelling (EN)','EN','Idem, em inglês',''],['Crédito e cobrança','PT','Lista de 12 casos, pergunta, dica, galeria','Medidas SELECTEDVALUE'],['Credit & collections','EN','Idem, campos em inglês',''],['Sobre · About','PT/EN','Foto, LinkedIn, portfólio, referências','Botões de link para o perfil e o portfólio']];
  const F=[['ok','Filtros em listas suspensas','Um clique abre a lista; em branco = qualquer valor'],['ok','Essenciais ou demais','Slicer com Essenciais pré-selecionado (16 gráficos); selecionar também "Demais" libera os 59'],['ok','Um cartão por gráfico, em tamanho compacto','Seis por linha; detalhes abrem no leitor do Card Browser'],['ok','Aba Storytelling','8 tópicos com ideia, três passos e exemplos antes/depois, em português e inglês'],['ok','Português e inglês','Uma página por idioma'],['ok','Crédito e cobrança por caso','12 casos; pergunta e dica por medida SELECTEDVALUE'],['ok','Contador e Limpar filtros','Cartão com medida (DAX) e ação "Limpar todos os slicers"'],['ok','Portfólio e LinkedIn','Links no cabeçalho e na página Sobre, sem borda (formas transparentes)'],['nat','Cruzamento entre slicers e galeria','Relacionamento bidirecional entre Fato_Selecao e Dim_Grafico'],['nat','Texto alternativo e ordem do Tab','Configurados visual a visual no Power BI'],['web','Busca por pergunta','Power BI não tem caixa de busca livre nativa'],['web','Comparar dois gráficos','Exige interação que o Power BI não oferece'],['web','Link direto para cada gráfico','Só na versão web (GitHub Pages)'],['plan','Atalhos "Comece por aqui"','Bookmarks a criar no Desktop'],['plan','Layout para celular','Galeria de 2 colunas (prévia abaixo)'],['plan','Pôster A3 em PDF, PT e EN','Gerado a partir das ilustrações'],['plan','Especificação Deneb por gráfico','Começa pelos 10 mais pedidos'],['plan','Fichas para LinkedIn e errado × certo','1080×1350, um conjunto por gráfico'],['plan','Espanhol e histórico de versões','Terceira página de idioma e CHANGELOG']];
 const tg={ok:['Pronto','t-ok'],nat:['Nativo no Power BI','t-nat'],web:['Só na versão web','t-web'],plan:['Planejado','t-plan']};
 const bx=(x,n,cols,sub)=>`<g><rect class="b" x="${x}" y="40" width="160" height="${36+cols.length*20}"/><rect class="hh" x="${x}" y="40" width="160" height="26"/><text class="hl" x="${x+10}" y="58">${n}</text>${cols.map((c,i)=>`<text x="${x+10}" y="${86+i*20}">${c}</text>`).join('')}<text class="m" x="${x}" y="${40+36+cols.length*20+16}">${sub}</text></g>`;
 const ar=(a,b,l)=>`<line x1="${a}" y1="100" x2="${b}" y2="100"/><text class="m" x="${(a+b)/2-10}" y="92">${l}</text>`;
 const er2=`<svg viewBox="0 0 1000 150" role="img" aria-label="Modelo de dados do Storytelling">${bx(2,'Dim_Passo',['id_passo','id_topico','ordem','texto_pt / texto_en'],'24 linhas')}${bx(210,'Dim_Topico',['id_topico','titulo_pt / en','ideia_pt / en'],'8 tópicos')}${bx(418,'Dim_Exemplo',['id_exemplo','id_topico','legenda_pt / en','imagem_pt / en'],'16 exemplos')}${ar(162,210,'*:1')}${ar(370,418,'1:*')}</svg>`;
 const er=`<svg viewBox="0 0 1000 220" role="img" aria-label="Modelo de dados">${bx(2,'Dim_Objetivo',['id_objetivo','objetivo_pt','objetivo_en'],'dimensão')}${bx(210,'Fato_Selecao',['id_selecao','id_objetivo','id_grafico','vars · tempo · cat','valores · composição'],'fato (171 linhas)')}${bx(418,'Dim_Grafico',['id_grafico','nome_pt / nome_en','imagem_url','uso · cuidado','essencial · perfil'],'dimensão (59)')}${bx(626,'Ponte_Caso_Grafico',['id_caso','id_grafico','ordem'],'ponte')}${bx(838,'Dim_Caso',['id_caso','titulo_pt / en','pergunta','dica'],'dimensão (12)')}${ar(162,210,'1:*')}${ar(370,418,'*:1 ↔')}${ar(578,626,'1:*')}${ar(786,838,'*:1')}</svg>`;
 return `<div class="bs"><h2>Mapa de páginas</h2><p class="l">Sete páginas, como as abas do relatório. A troca de idioma leva a outra página e limpa os filtros, igual ao Power BI.</p><table><tr><th>Página</th><th>Idioma</th><th>Visuais</th><th>Observação</th></tr>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table>
 <h2>Modelo de dados</h2><p class="l">Oito tabelas. A seta dupla indica filtro nos dois sentidos: ao filtrar a galeria pelos slicers, só os gráficos válidos aparecem.</p><div class="er">${er}${er2}</div>
 <h2>Funcionalidades</h2><p class="l">O que já está resolvido, o que é nativo do Power BI, o que só existe na versão web e o que vem depois.</p><table><tr><th>Funcionalidade</th><th>Detalhe</th><th>Situação</th></tr>${F.map(f=>`<tr><td>${f[1]}</td><td>${f[2]}</td><td><span class="tag ${tg[f[0]][1]}">${tg[f[0]][0]}</span></td></tr>`).join('')}</table>
 <h2>Acessibilidade: o que foi medido</h2><p class="l">Razões de contraste calculadas (mínimo de 4,5:1 para texto e 3:1 para elementos gráficos). O que não foi medido está marcado como a testar.</p>
 <table><tr><th>Item</th><th>Resultado</th><th>Situação</th></tr>
 <tr><td>Texto do corpo sobre o fundo</td><td>16,1:1</td><td><span class="tag t-ok">Passa</span></td></tr>
 <tr><td>Texto secundário e rótulos</td><td>6,6:1 e 5,5:1</td><td><span class="tag t-ok">Passa</span></td></tr>
 <tr><td>Título branco sobre o cartão roxo</td><td>7,1:1</td><td><span class="tag t-ok">Passa</span></td></tr>
 <tr><td>Nota da aba inferior</td><td>era 3,8:1, agora 5,7:1</td><td><span class="tag t-ok">Corrigido</span></td></tr>
 <tr><td>Tamanho mínimo do texto</td><td>era 9 pt nos filtros, agora 14 px (cerca de 10,5 pt)</td><td><span class="tag t-ok">Corrigido</span></td></tr>
 <tr><td>Coral nas ilustrações</td><td>2,9:1, abaixo de 3:1. Nunca é o único sinal: posição e contorno dizem o mesmo</td><td><span class="tag t-web">Atenção</span></td></tr>
 <tr><td>Assinatura nas ilustrações</td><td>3,3:1, decorativa</td><td><span class="tag t-plan">Aceito</span></td></tr>
 <tr><td>Leitor de tela, ordem do Tab, foco visível</td><td>Foco e rótulos prontos na simulação; no Power BI, a configurar</td><td><span class="tag t-plan">A testar no Desktop</span></td></tr>
 <tr><td>Daltonismo (simulação das ilustrações)</td><td>Ainda não feito</td><td><span class="tag t-plan">A testar</span></td></tr></table>
 <h2>Layout para celular (prévia)</h2><p class="l">O Power BI pede um layout de celular separado. Esta é uma prévia estática do que será montado: filtros recolhidos em um botão e galeria de 2 colunas.</p>
 <div class="ph"><div class="phone"><div class="ph-h">Lucas Delfino · Guia</div><div class="ph-f">Filtros (6) ▾</div><div class="ph-g">${['colunas','linha','dispersao','treemap'].map(s=>`<div class="ph-c"><img src="${img(s)}" alt=""><div>${esc(BY[s].pt)}</div></div>`).join('')}</div></div><p class="pn">Alvos de toque de pelo menos 44 px, rolagem só na vertical e título em primeiro lugar. O mesmo contador e o botão Limpar filtros ficam no topo.</p></div>
 <h2>Pendências suas</h2><table><tr><th>Decisão</th><th>Situação</th></tr><tr><td>Licença de uso das ilustrações e textos</td><td><span class="tag t-web">Aguardando</span></td></tr><tr><td>Conferir a licença do material do Financial Times antes de publicar as referências</td><td><span class="tag t-web">Aguardando</span></td></tr></table></div>`}
function fit(){const w=$('stage').clientWidth-32,s=Math.max(.62,Math.min(1,w/1280));const cv=$('cv');cv.style.transform=`scale(${s})`;$('wrap').style.width=1280*s+'px';$('wrap').style.height=720*s+'px'}
function render(){
 const L=lang(),t=T[L];document.documentElement.lang=L==='pt'?'pt-BR':'en';document.title=L==='pt'?'Guia de Visualização':'Visualization Guide';
 $('sub').textContent=L==='pt'?'Simulação de como fica no Power BI':'Simulation of the Power BI report';
 const keepG=S.rd?null:document.querySelector('.gal,.cm'),sc=keepG?keepG.scrollTop:0;
 let b=S.page==='sobre'?pageAbout(L,t):S.page.startsWith('cr')?pageCases(L,t):S.page.startsWith('st')?pageStory(L,t):pageGuide(L,t);
 $('cv').innerHTML=header(L,t)+b+tabs(t);
 const g=document.querySelector('.gal,.cm');if(g)g.scrollTop=sc;
 $('stage').hidden=S.view!=='rep';$('bsw').hidden=S.view!=='bs';
 $('vRep').setAttribute('aria-pressed',S.view==='rep');$('vBs').setAttribute('aria-pressed',S.view==='bs');
 if(S.view==='bs')$('bsw').innerHTML=bastidores();fit();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='vRep'){S.view='rep';render();return}if(b.id==='vBs'){S.view='bs';render();return}
 if(b.id==='th'){const d=document.documentElement;d.dataset.theme=(d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'?'light':'dark';return}
 if(b.dataset.setlang){const nl=b.dataset.setlang;if(nl!==S.lang){reset();S.lang=nl;if(S.page!=='sobre')S.page=(S.page.startsWith('cr')?'cr_':S.page.startsWith('st')?'st_':'')+nl}render();return}
 if(b.dataset.url){window.open(b.dataset.url,'_blank','noopener');return}
 if(b.dataset.close){S.rd=0;render();return}
 if(b.dataset.tp!==undefined){S.tp=+b.dataset.tp;render();return}
 if(b.dataset.go){go(b.dataset.go);return}
 if(b.dataset.clear){reset();render();return}
 if(b.dataset.qs){const o=b.dataset.qs;K.forEach(k=>S[k].clear());S.flip.clear();S.obj=S.obj===o?'':o;render();return}
 if(b.dataset.ess!==undefined){S.ess=b.dataset.ess==='1';S.flip.clear();render();return}
 if(b.dataset.k){const k=b.dataset.k,v=+b.dataset.v;S[k].has(v)?S[k].delete(v):S[k].add(v);render();return}
 if(b.dataset.cs!==undefined){S.cs=+b.dataset.cs;S.flip.clear();render();return}
 if(b.dataset.g){S.rd=+b.dataset.g;render()}
});
document.addEventListener('change',e=>{if(e.target.id==='obj'){S.obj=e.target.value;render()}if(e.target.dataset.sel){const k=e.target.dataset.sel;S[k].clear();if(e.target.value!=='')S[k].add(+e.target.value);render()}});
addEventListener('resize',fit);render();
</script></body></html>
