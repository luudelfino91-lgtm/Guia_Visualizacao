<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guia de Visualização</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&display=swap">
<style>
:root{--bg:#F5F3F8;--fg:#1B1426;--mut:#6A6277;--line:#DDD6E6;--panel:#FFFFFF;--acc:#7139B8;--tagbg:#EFE8F7}
:root[data-theme=dark]{--bg:#150F1E;--fg:#ECE7F3;--mut:#9C93AB;--line:#2E2640;--panel:#1D1629;--acc:#B66BEA;--tagbg:#2A2040}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#150F1E;--fg:#ECE7F3;--mut:#9C93AB;--line:#2E2640;--panel:#1D1629;--acc:#B66BEA;--tagbg:#2A2040}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bar{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar b{font:700 14px "Bricolage Grotesque","Segoe UI",sans-serif}
.bar .seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-left:auto}
.bar .seg button{border:0;background:none;color:var(--fg);padding:6px 14px;font:inherit;cursor:pointer}
.bar .seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.bar .th{border:1px solid var(--line);background:none;color:var(--fg);border-radius:4px;padding:6px 10px;cursor:pointer;font:inherit}
.stage{overflow-x:auto;padding:16px}
.wrap{margin:0 auto}
/* ---------- tela do relatório (fixa 1280x720, como o Power BI) ---------- */
.cv{--p:#7139B8;--pd:#1C0F33;--ink:#211A2B;--soft:#F4ECFC;--hair:#E3DAEE;--lime:#D7F34A;--coral:#FF665D;
 width:1280px;height:720px;transform-origin:0 0;background:#FBF9FD;color:var(--ink);position:relative;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;font-size:13px;border:1px solid var(--hair)}
.hd{position:absolute;left:0;top:0;width:1280px;height:56px;background:var(--pd);display:flex;align-items:center;padding:0 24px;gap:28px;color:#fff}
.hd .brand{font:700 17px "Bricolage Grotesque","Segoe UI",sans-serif;letter-spacing:-.01em;margin-right:auto}
.hd .brand small{display:block;font:600 9px "Segoe UI",sans-serif;letter-spacing:.14em;color:#B9A8D6;margin-top:1px}
.hd button.n{background:none;border:0;border-bottom:2px solid transparent;color:#CFC2E6;font:inherit;padding:6px 0;cursor:pointer}
.hd button.n:hover{color:#fff}.hd button.n[aria-current=page]{color:#fff;border-bottom-color:var(--lime)}
.hd .lang{display:flex;gap:2px;font-size:12px}.hd .lang button{background:none;border:0;color:#CFC2E6;padding:4px 7px;cursor:pointer;font:inherit}
.hd .lang button[aria-pressed=true]{color:var(--pd);background:#fff;border-radius:2px;font-weight:700}
.hd img.me{width:38px;height:38px;border-radius:50%;object-fit:cover;display:block}
.tt{position:absolute;left:24px;top:70px;font:800 30px/1 "Bricolage Grotesque","Segoe UI",sans-serif;letter-spacing:-.02em}
.tt mark{background:linear-gradient(transparent 58%,var(--lime) 58% 92%,transparent 92%);color:inherit;padding:0 2px}
.st{position:absolute;left:24px;top:108px;color:#5F5670;font-size:13px}
.ct{position:absolute;right:24px;top:76px;display:flex;align-items:center;gap:16px}
.ct .cnt{font-size:13px;color:#5F5670}.ct .cnt strong{font:800 26px "Bricolage Grotesque","Segoe UI",sans-serif;color:var(--p);margin-right:4px}
.ct button{border:1px solid var(--ink);background:none;color:var(--ink);padding:6px 12px;border-radius:3px;font:inherit;cursor:pointer}
.ct button:hover{background:var(--ink);color:#fff}
.sl{position:absolute;left:24px;right:24px;top:140px;height:76px;display:grid;grid-template-columns:200px repeat(5,1fr);column-gap:22px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:9px 0}
.sl h2{margin:0 0 6px;font:700 10px "Segoe UI";letter-spacing:.12em;text-transform:uppercase;color:#6A6277}.sl h2 i{font-style:normal;color:var(--p);margin-right:6px}
.sl select{width:100%;height:30px;border:1px solid #C9BDDA;background:#fff;border-radius:3px;padding:0 8px;font:inherit;color:var(--ink)}
.sl .o{display:flex;gap:4px}.sl .o button{flex:1;height:30px;border:1px solid #C9BDDA;background:#fff;color:var(--ink);border-radius:3px;font:inherit;font-size:12px;cursor:pointer;padding:0 4px;white-space:nowrap}
.sl .o button:hover{background:var(--soft)}.sl .o button[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
.gal{position:absolute;left:24px;right:24px;top:228px;bottom:44px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#C9BDDA transparent;padding-right:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cd{background:#fff;border:1px solid var(--hair);border-radius:3px;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;display:block;width:100%}
.cd:hover{border-color:var(--p)}
.cd img{display:block;width:100%;aspect-ratio:8/5;background:#fff;border-bottom:1px solid var(--hair)}
.cd .ti{background:var(--p);color:#fff;padding:7px 10px;font:600 13px "Segoe UI";min-height:32px;display:flex;align-items:center}
.cd.f{cursor:pointer}.cd .bk{padding:10px 12px;font-size:12px;line-height:1.4;aspect-ratio:8/5;overflow:hidden;border-bottom:1px solid var(--hair)}
.cd .bk dt{font:700 9.5px "Segoe UI";letter-spacing:.1em;text-transform:uppercase;color:var(--p);margin-top:6px}.cd .bk dt:first-child{margin-top:0}.cd .bk dd{margin:1px 0 0}
.emp{padding:60px 0;text-align:center;color:#5F5670}.emp b{display:block;font:700 20px "Bricolage Grotesque";color:var(--ink);margin-bottom:4px}
.pg{position:absolute;left:0;right:0;bottom:0;height:32px;background:#EEE8F5;border-top:1px solid var(--hair);display:flex;align-items:flex-end;padding-left:24px;gap:2px}
.pg button{border:0;background:none;padding:6px 16px;font:inherit;font-size:12px;color:#5F5670;cursor:pointer;border-top:2px solid transparent}
.pg button[aria-current=page]{background:#FBF9FD;color:var(--ink);font-weight:600;border-top-color:var(--p)}
.pg span{margin-left:auto;margin-right:24px;align-self:center;font-size:11px;color:#7B7289}
/* credito */
.cs{position:absolute;left:24px;top:76px;bottom:44px;width:290px;border-right:1px solid var(--hair);padding-right:16px;overflow-y:auto}
.cs h2{margin:0 0 8px;font:700 10px "Segoe UI";letter-spacing:.12em;text-transform:uppercase;color:#6A6277}
.cs button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;font:inherit;color:var(--ink);border-left:3px solid transparent;cursor:pointer}
.cs button:hover{background:var(--soft)}.cs button[aria-pressed=true]{background:var(--soft);border-left-color:var(--p);font-weight:600}
.cm{position:absolute;left:340px;right:24px;top:76px;bottom:44px;overflow-y:auto}
.cm .q{font:800 28px/1.12 "Bricolage Grotesque","Segoe UI",sans-serif;letter-spacing:-.02em;margin:0 0 10px;max-width:760px}
.cm .tip{border-left:3px solid var(--lime);padding:2px 0 2px 12px;margin:0 0 18px;max-width:700px;color:#4A4158}
.cm .kc{font:700 10px "Segoe UI";letter-spacing:.12em;text-transform:uppercase;color:#6A6277;margin-bottom:8px}
/* sobre */
.ab{position:absolute;left:24px;right:24px;top:80px;bottom:44px;display:grid;grid-template-columns:360px 1fr;gap:48px}
.ab .l img{width:200px;height:200px;object-fit:cover;display:block;border-radius:3px}
.ab .l h1{font:800 34px/1.05 "Bricolage Grotesque";letter-spacing:-.02em;margin:18px 0 4px}.ab .l p{margin:0;color:#5F5670}
.ab a.in{display:inline-block;margin-top:16px;background:var(--p);color:#fff;padding:9px 16px;text-decoration:none;border-radius:3px;font-weight:600}
.ab .r h2{font:800 30px "Bricolage Grotesque";letter-spacing:-.02em;margin:0 0 6px}.ab .r .sub{color:#5F5670;margin:0 0 18px}
.ab ul{list-style:none;padding:0;margin:0 0 18px;border-top:1px solid var(--hair)}.ab li{padding:9px 0;border-bottom:1px solid var(--hair)}
.ab .cr{background:var(--soft);padding:12px 14px;border-radius:3px;max-width:560px}
/* bastidores */
.bs{max-width:1280px;margin:0 auto;padding:4px 0 40px}
.bs h2{font:800 22px "Bricolage Grotesque","Segoe UI";letter-spacing:-.01em;margin:32px 0 10px}
.bs p.l{color:var(--mut);margin:0 0 14px;max-width:70ch}
.bs table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
.bs th{font:700 11px "Segoe UI";letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.bs td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.bs tr:last-child td{border-bottom:0}
.tag{display:inline-block;font:600 11px "Segoe UI";padding:2px 8px;border-radius:3px;white-space:nowrap}
.t-ok{background:#DDF5C8;color:#2C5A0F}.t-nat{background:var(--tagbg);color:var(--acc)}.t-web{background:#FFE3B8;color:#7A4A00}.t-plan{background:transparent;border:1px solid var(--line);color:var(--mut)}
:root[data-theme=dark] .t-ok{background:#27401B;color:#BDEB9A}:root[data-theme=dark] .t-web{background:#4A3510;color:#FFD08A}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .t-ok{background:#27401B;color:#BDEB9A}:root:not([data-theme=light]) .t-web{background:#4A3510;color:#FFD08A}}
.er{background:var(--panel);border:1px solid var(--line);padding:12px;overflow-x:auto}
.er svg{display:block;min-width:900px;width:100%;height:auto}
.er text{fill:var(--fg);font:12px "Segoe UI",sans-serif}.er .h{font-weight:700}.er .m{fill:var(--mut);font-size:11px}
.er rect.b{fill:var(--panel);stroke:var(--fg)}.er rect.hh{fill:var(--acc)}.er .hl{fill:#fff;font-weight:700}.er line,.er path{stroke:var(--fg);fill:none}
</style></head><body>
<div class="bar"><b>Guia de Visualização</b><span style="color:var(--mut)" id="sub"></span>
 <div class="seg" role="group"><button id="vRep" aria-pressed="true">Relatório</button><button id="vBs" aria-pressed="false">Bastidores</button></div>
 <button class="th" id="th" aria-label="Tema">◐</button></div>
<div class="stage" id="stage"><div class="wrap" id="wrap"><div class="cv" id="cv"></div></div></div>
<div class="stage" id="bsw" hidden></div>
<script>
const D={"charts": [{"id": 1, "slug": "barra_divergente", "pt": "Barras divergentes", "en": "Diverging bars", "uso_pt": "Compara valores acima e abaixo de uma referência.", "uso_en": "Compares values above and below a reference.", "cuidado_pt": "Defina a referência (zero ou meta) e mantenha uma só escala.", "cuidado_en": "Fix the reference (zero or target) and keep one scale.", "pbi_pt": "Nativo, com ajuste · Barras agrupadas com valores negativos", "pbi_en": "Native, adapted · Clustered bar with negative values", "usado_pt": "Financeira", "usado_en": "Financial", "perfil": "especialista"}, {"id": 2, "slug": "espinha", "pt": "Gráfico de espinha", "en": "Spine chart", "uso_pt": "Espelha duas partes de um total ao redor de um eixo central.", "uso_en": "Mirrors two parts of a whole around a central axis.", "cuidado_pt": "Funciona com no máximo 2 categorias.", "cuidado_en": "Works with 2 categories at most.", "pbi_pt": "Deneb (Vega-Lite) · Deneb", "pbi_en": "Deneb (Vega-Lite) · Deneb", "usado_pt": "Financeira", "usado_en": "Financial", "perfil": "especialista"}, {"id": 3, "slug": "area_divergente", "pt": "Área divergente", "en": "Diverging area", "uso_pt": "Mostra no tempo quando o valor passa de positivo a negativo.", "uso_en": "Shows over time when a value flips from positive to negative.", "cuidado_pt": "Use cores distintas e rotule o ponto de virada.", "cuidado_en": "Use distinct colors and label the turning point.", "pbi_pt": "Deneb (Vega-Lite) · Área com valores negativos, ou Deneb", "pbi_en": "Deneb (Vega-Lite) · Area with negative values, or Deneb", "usado_pt": "Financeira", "usado_en": "Financial", "perfil": "especialista"}, {"id": 4, "slug": "dispersao", "pt": "Gráfico de dispersão", "en": "Scatter plot", "uso_pt": "Mostra se duas variáveis contínuas andam juntas.", "uso_en": "Shows whether two continuous variables move together.", "cuidado_pt": "Correlação não prova causa.", "cuidado_en": "Correlation does not prove causation.", "pbi_pt": "Nativo · Gráfico de chart", "usado_pt": "Comercial", "usado_en": "Commercial", "perfil": "classico"}, {"id": 9, "slug": "pirulito", "pt": "Gráfico de pirulito", "en": "Lollipop chart", "uso_pt": "Destaca o valor final com menos tinta que a barra.", "uso_en": "Highlights the end value with less ink than a bar.", "cuidado_pt": "Ordene para formar um ranking legível.", "cuidado_en": "Sort it so the ranking reads clearly.", "pbi_pt": "Deneb (Vega-Lite) · Deneb ou visual externo", "pbi_en": "Deneb (Vega-Lite) · Deneb or custom visual", "usado_pt": "Comercial", "usado_en": "Commercial", "perfil": "especialista"}, {"id": 10, "slug": "inclinacao", "pt": "Gráfico de inclinação", "en": "Slope chart", "uso_pt": "Mostra a mudança entre dois momentos ou condições.", "uso_en": "Shows change between two moments or conditions.", "cuidado_pt": "Poucos itens e rótulos nas duas pontas.", "cuidado_en": "Few items, with labels at both ends.", "pbi_pt": "Nativo, com ajuste · Linhas com apenas 2 pontos", "pbi_en": "Native, adapted · Line chart with only 2 points", "usado_pt": "Comercial", "usado_en": "Commercial", "perfil": "especialista"}, {"id": 11, "slug": "bump", "pt": "Gráfico de posições (bump)", "en": "Bump chart", "uso_pt": "Mostra como o ranking muda ao longo do tempo.", "uso_en": "Shows how a ranking changes over time.", "cuidado_pt": "Destaque só o que importa e esmaeça o resto.", "cuidado_en": "Highlight only what matters and fade the rest.", "pbi_pt": "Nativo, com ajuste · Gráfico de faixas (ribbon), ou Deneb", "pbi_en": "Native, adapted · Ribbon chart, or Deneb", "usado_pt": "Comercial", "usado_en": "Commercial", "perfil": "especialista"}, {"id": 12, "slug": "tabela", "pt": "Tabela", "en": "Table", "uso_pt": "Entrega o detalhe exato quando o leitor precisa dos números.", "uso_en": "Gives exact detail when the reader needs the numbers.", "cuidado_pt": "Use cor e ícones com moderação para guiar o olhar.", "cuidado_en": "Use color and icons sparingly to guide the eye.", "pbi_pt": "Nativo · Tabela"  <h2>Funcionalidades</h2><p class="l">O que já está resolvido, o que é nativo do Power BI, o que só existe na versão web e o que vem depois.</p><table><tr><th>Funcionalidade</th><th>Detalhe</th><th>Situação</th></tr>${F.map(f=>`<tr><td>${f[1]}</td><td>${f[2]}</td><td><span class="tag ${tg[f[0]][1]}">${tg[f[0]][0]}</span></td></tr>`).join('')}</table></div>`}
function fit(){const w=$('stage').clientWidth-32,s=Math.max(.62,Math.min(1,w/1280));const cv=$('cv');cv.style.transform=`scale(${s})`;$('wrap').style.width=1280*s+'px';$('wrap').style.height=720*s+'px'}
function render(){
 const L=lang(),t=T[L];document.documentElement.lang=L==='pt'?'pt-BR':'en';document.title=L==='pt'?'Guia de Visualização':'Visualization Guide';
 $('sub').textContent=L==='pt'?'Simulação de como fica no Power BI':'Simulation of the Power BI report';
 const keepG=document.querySelector('.gal,.cm'),sc=keepG?keepG.scrollTop:0;
 let b=S.page==='sobre'?pageAbout(L,t):S.page.startsWith('cr')?pageCases(L,t):pageGuide(L,t);
 $('cv').innerHTML=header(L,t)+b+tabs(t);
 const g=document.querySelector('.gal,.cm');if(g)g.scrollTop=sc;
 $('stage').hidden=S.view!=='rep';$('bsw').hidden=S.view!=='bs';
 $('vRep').setAttribute('aria-pressed',S.view==='rep');$('vBs').setAttribute('aria-pressed',S.view==='bs');
 if(S.view==='bs')$('bsw').innerHTML=bastidores();fit();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='vRep'){S.view='rep';render();return}if(b.id==='vBs'){S.view='bs';render();return}
 if(b.id==='th'){const d=document.documentElement;d.dataset.theme=(d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'?'light':'dark';return}
 if(b.dataset.li){window.open(LI,'_blank','noopener');return}
 if(b.dataset.go){go(b.dataset.go);return}
 if(b.dataset.clear){reset();render();return}
 if(b.dataset.k){const k=b.dataset.k,v=+b.dataset.v;S[k].has(v)?S[k].delete(v):S[k].add(v);render();return}
 if(b.dataset.cs!==undefined){S.cs=+b.dataset.cs;S.flip.clear();render();return}
 if(b.dataset.g){const g=+b.dataset.g;S.flip.has(g)?S.flip.delete(g):S.flip.add(g);render()}
});
document.addEventListener('change',e=>{if(e.target.id==='obj'){S.obj=e.target.value;render()}});
addEventListener('resize',fit);render();
